<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings — BayPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar(active='dashboard')}"></div>

  <main class="app-main">
    <div class="page-head"><h1>Account settings</h1></div>

    <div class="card form-card">
      <h3 style="margin-top:0;">Change password</h3>

      <div th:if="${success}" class="alert alert-success" th:text="${success}">Password updated</div>
      <div th:if="${error}" class="alert alert-error" th:text="${error}">Something went wrong</div>

      <form th:action="@{/settings/password}" method="post" class="stack">
        <div class="field">
          <label for="currentPassword">Current password</label>
          <input type="password" id="currentPassword" name="currentPassword" required>
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input type="password" id="newPassword" name="newPassword" required minlength="8">
        </div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
    </div>
  </main>

</body>
</html>
