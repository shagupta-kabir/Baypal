<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transaction history — BayPal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <link rel="stylesheet" th:href="@{/css/dashboard.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

  <div th:replace="~{fragments/navbar :: navbar(active='transactions')}"></div>

  <main class="app-main wide">
    <div class="page-head">
      <h1>Transaction history</h1>
      <a class="btn btn-primary" th:href="@{/transactions/send}">Send money</a>
    </div>

    <div class="card" style="padding:0; overflow:hidden;">
      <table class="data-table" th:if="${not #lists.isEmpty(transactions)}">
        <thead>
          <tr>
            <th>Type</th>
            <th>With</th>
            <th>Note</th>
            <th>Date</th>
            <th style="text-align:right;">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="tx : ${transactions}">
            <td>
              <span class="chip" th:classappend="${tx.type == 'CREDIT'} ? 'chip-tea' : 'chip-blush'"
                    th:text="${tx.type == 'CREDIT'} ? 'Received' : 'Sent'">Sent</span>
            </td>
            <td><a th:href="@{'/transactions/' + ${tx.id}}" th:text="${tx.counterpartyName}">Someone</a></td>
            <td class="muted" th:text="${tx.note ?: '—'}">—</td>
            <td class="muted" th:text="${#temporals.format(tx.createdAt, 'MMM d, yyyy · h:mm a')}">Aug 21, 2026</td>
            <td style="text-align:right; font-weight:700;"
                th:classappend="${tx.type == 'CREDIT'} ? 'amt-in' : 'amt-out'"
                th:text="${(tx.type == 'CREDIT' ? '+' : '-') + '$' + #numbers.formatDecimal(tx.amount,1,2)}">+$0.00</td>
          </tr>
        </tbody>
      </table>

      <div class="empty-state" th:if="${#lists.isEmpty(transactions)}">
        <p style="margin:0;">No transactions yet.</p>
      </div>
    </div>
  </main>

</body>
</html>
